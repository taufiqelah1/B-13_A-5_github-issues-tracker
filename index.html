<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Issues Tracker</title>
<link rel="icon" type="image/png" href="assets/github-logo.png">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <!-- daisyUI and Tailwind CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/daisyui@5/daisyui.css"
    rel="stylesheet"
    type="text/css"
  >

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
  >

  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
    
<!-- LOGIN PAGE -->
  <main
    id="login-page"
    class="login-page flex items-center justify-center"
  >
    <section class="login-card card bg-base-100">
      <header class="login-heading text-center">
        <img
          src="assets/github-logo.png"
          class="login-logo"
          width="100"
          height="100"
          alt="GitHub"
        >

        <h1>GitHub Issues Tracker</h1>
        <p>Sign in to manage your issues</p>
      </header>

      <form id="login-form">
        <div class="login-fields">
          <div class="field">
            <label for="username">Username</label>

            <input
              id="username"
              class="input w-full"
              type="text"
              placeholder="Enter Username"
              autocomplete="username"
              required
            >

            <p class="field-hint">Default: admin</p>
          </div>

          <div class="field">
            <label for="password">Password</label>

            <input
              id="password"
              class="input w-full"
              type="password"
              placeholder="Enter Password"
              autocomplete="current-password"
              required
            >

            <p class="field-hint">Default: admin123</p>
          </div>
        </div>

        <p
          id="login-error"
          class="login-error"
          role="alert"
          hidden
        >
          Incorrect username or password. Please try again.
        </p>

        <button
          class="btn btn-primary sign-in w-full"
          type="submit"
        >
          Sign In
        </button>
      </form>

      <div class="or-divider">
        <span></span>
        OR
        <span></span>
      </div>

      <div class="demo text-center">
        <p>Demo Credentials:</p>

        <div class="demo-box">
          <p><strong>Username:</strong> admin</p>
          <p><strong>Password:</strong> admin123</p>
        </div>
      </div>
    </section>
  </main>



</body>
</html>
